version: 1

input:
  file: customers.csv

request:
  method: POST
  url: http://127.0.0.1:8000/concurrent/users
  headers:
    X-Demo-Client: bulkrelay
  json:
    email:
      from: email
    first_name:
      from: first_name
    source:
      value: concurrency-demo

execution:
  concurrency: 4
  timeout:
    connect_seconds: 2
    read_seconds: 5
    write_seconds: 5
    pool_seconds: 2

retry:
  max_attempts: 1

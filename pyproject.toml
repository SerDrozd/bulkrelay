[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bulkrelay"
version = "0.1.0a5"
description = "Reliable bulk HTTP jobs from CSV and JSONL files."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Serhii Drozdov" }]
keywords = [
  "api",
  "bulk",
  "cli",
  "csv",
  "http",
  "jsonl",
  "migration",
  "retries",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "rich>=13.7,<16",
  "typer>=0.12,<1",
]

[project.urls]
Repository = "https://github.com/SerDrozd/bulkrelay"
Issues = "https://github.com/SerDrozd/bulkrelay/issues"

[project.scripts]
bulkrelay = "bulkrelay.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bulkrelay"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["bulkrelay"]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
  "fastapi>=0.115,<1",
  "mypy>=1.11,<3",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0,<7",
  "uvicorn>=0.30,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bulkrelay"
version = "0.1.0a4"
description = "Reliable bulk HTTP jobs from CSV and JSONL files."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Serhii Drozdov" }]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "fastapi>=0.115,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0,<7",
  "uvicorn>=0.30,<1",
]

[project.scripts]
bulkrelay = "bulkrelay.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bulkrelay"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["bulkrelay"]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
  "fastapi>=0.115,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0,<7",
  "uvicorn>=0.30,<1",
]
